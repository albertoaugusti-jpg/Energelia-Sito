<!-- Griglia card Regioni: portali ufficiali dei bandi (usata in /portali-bandi e in homepage) -->
<style>
  .regioni-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    max-width: 1020px;
    margin: 0 auto;
  }
  .regione-link {
    display: block;
    text-decoration: none;
    text-align: center;
    color: #0a1530;
    scroll-margin-top: 110px;
  }
  .regione-link img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 22px;
    box-shadow: 0 10px 26px rgba(10, 21, 48, 0.22);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .regione-link:hover img {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 40px rgba(212, 175, 55, 0.38);
  }
  .regione-link .didascalia {
    display: block;
    margin-top: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #5a6577;
  }
  .regione-link:hover .didascalia { color: #b8860b; }
  @media (max-width: 767px) {
    .regioni-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .regione-link .didascalia { font-size: 0.78rem; }
  }
</style>
